spring.application.name=crs

# ===== 테스트 전용 설정 =====
# 단위 테스트(@ExtendWith(MockitoExtension)) 와 슬라이스 테스트(@WebMvcTest) 는
# DB / SMTP / 카카오 API 에 전혀 접속하지 않는다(모든 외부 의존성은 목킹됨).
# 아래 datasource 설정은 @SpringBootTest(CrsApplicationTests) 가 기존과 동일하게 동작하도록
# main 의 application.properties 값을 그대로 유지한 것이다.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/crs?serverTimezone=Asia/Seoul&useUnicode=true&characterEncoding=utf8
spring.datasource.username=root

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update

cors.allowed-origins=http://localhost:3000

# 실제 비밀키가 아닌 테스트용 더미 값 (HS256 최소 길이 충족)
app.jwtSecret=test-jwt-secret-key-for-unit-tests-1234567890
app.jwtExpirationMs=3600000

app.upload.dir=build/test-uploads/
app.base-url=http://localhost:8080
app.cookie.secure=false

spring.config.import=optional:classpath:application-secret.properties

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
